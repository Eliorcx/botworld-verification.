<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify Your Account</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: var(--tg-theme-bg-color, #17212b);
      color: var(--tg-theme-text-color, #ffffff);
      font-family: system-ui, -apple-system, sans-serif;
    }
    main { width: min(100%, 420px); text-align: center; }
    .mark {
      width: 92px; height: 92px; margin: 0 auto 24px; border-radius: 28px;
      display: grid; place-items: center; background: #2481cc; font-size: 44px;
    }
    h1 { font-size: 27px; margin: 0 0 12px; }
    p { color: var(--tg-theme-hint-color, #aab7c4); line-height: 1.55; margin: 0 0 26px; }
    button {
      width: 100%; border: 0; border-radius: 14px; padding: 16px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
      font-size: 17px; font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #result { margin-top: 18px; min-height: 24px; font-weight: 600; }
    .note { font-size: 12px; margin-top: 28px; }
  </style>
</head>
<body>
  <main>
    <div class="mark">✓</div>
    <h1>Verify Your Account</h1>
    <p>Press the button below to begin account verification.</p>
    <button id="verify">Verify</button>
    <div id="result" role="status" aria-live="polite"></div>
    <p class="note">Your Telegram account information is used to identify your Botworld account.</p>
  </main>
  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    document.getElementById("verify").addEventListener("click", () => {
      const result = document.getElementById("result");
      result.textContent = "Verification service is not connected yet. Please try again later.";
    });
  </script>
</body>
</html>
