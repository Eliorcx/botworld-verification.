<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b24">
<title>Account Verification</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#070b24;--cyan:#18dcff;--blue:#247bff;--violet:#a32cff;--green:#20ef83}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px 16px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 12%,#18276b 0,#0b1238 34%,#06091e 75%);color:#f8fbff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
main{width:min(100%,420px);padding:25px 19px 22px;border:1px solid #347cff88;border-radius:27px;background:linear-gradient(155deg,#111c49ed,#080d29f5 70%);box-shadow:0 0 34px #174cff38,inset 0 0 28px #602aff16;text-align:center;overflow:hidden;position:relative}
main:before{content:"";position:absolute;inset:0;border-radius:27px;padding:1px;background:linear-gradient(130deg,#12dfff,#693bff,#c12cff,#12dfff);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.ring-wrap{height:178px;display:grid;place-items:center;position:relative;margin:0 auto 12px}.ring{width:150px;height:150px;border-radius:50%;background:conic-gradient(from 0deg,var(--cyan),var(--blue),var(--violet),#ec46ff,var(--cyan));padding:7px;animation:spin 2.2s linear infinite;filter:drop-shadow(0 0 13px #2b8cffaa)}.ring:before{content:"";display:block;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,#101c4a,#080e2b 70%);border:1px solid #79eaff88}.shield{position:absolute;font-size:48px;text-shadow:0 0 20px #1acbff}.orbit{position:absolute;width:174px;height:174px;border:1px solid #1c9cff55;border-radius:50%;animation:spin 5s linear infinite reverse}.orbit:after{content:"";position:absolute;width:9px;height:9px;left:17px;top:28px;border-radius:50%;background:#20eaff;box-shadow:0 0 14px #20eaff}
@keyframes spin{to{transform:rotate(360deg)}}h1{font-size:22px;margin:3px 0 14px;letter-spacing:.2px}.sub{font-size:13px;color:#9fb4e9;margin:0 0 15px}
.terminal{border:1px solid #3b65c9;border-radius:15px;background:#050a1d;text-align:left;padding:13px 13px 11px;min-height:135px;box-shadow:inset 0 0 20px #163d8b44}.term-head{display:flex;align-items:center;gap:6px;padding-bottom:9px;margin-bottom:8px;border-bottom:1px solid #1b2b57;color:#92a9df;font-size:11px;letter-spacing:1px}.dot{width:7px;height:7px;border-radius:50%;background:#24e89b;box-shadow:0 0 8px #24e89b}.logs{font:12px/1.85 ui-monospace,SFMono-Regular,Consolas,monospace;color:#b9d2ff;min-height:77px}.line{white-space:normal}.line:before{content:"> ";color:#20ddff}.cursor{display:inline-block;width:6px;height:13px;background:#20ddff;vertical-align:-2px;animation:blink .8s steps(2) infinite}@keyframes blink{50%{opacity:0}}
.progress{height:5px;border-radius:10px;background:#172653;margin:14px 0 0;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#12dfff,#733cff,#dc3cff);border-radius:10px;transition:width .5s}
.result{display:none;margin-top:17px;padding:15px 10px;border:1px solid #1ce887;border-radius:16px;background:linear-gradient(120deg,#063d36,#082b36);box-shadow:0 0 20px #00e88733}.check{width:40px;height:40px;margin:0 auto 7px;border-radius:50%;display:grid;place-items:center;background:#12d96f;color:#032719;font-size:26px;font-weight:900;box-shadow:0 0 20px #17ef86}.verified{font-size:21px;font-weight:850;color:#68ffb0}.status{font-size:11px;letter-spacing:1.4px;color:#c4ffe0;margin-top:4px}.continue{display:none;width:100%;border:0;border-radius:14px;padding:15px;margin-top:14px;background:linear-gradient(100deg,#0bb9ef,#315dff,#a52bfa);color:white;font-size:16px;font-weight:800;box-shadow:0 7px 22px #315dff55}.hint{font-size:11px;color:#7188c4;margin:12px 0 0}
body.done .ring{animation:none;background:conic-gradient(#18ee8b,#10c98d,#18ee8b)}body.done .shield{color:#36ff9d}body.done .result,body.done .continue{display:block}body.done .progress{display:none}
</style></head>
<body><main>
<div class="ring-wrap"><div class="orbit"></div><div class="ring"></div><div class="shield">⬡</div></div>
<h1>Account Verification</h1><p class="sub">Secure device and account check</p>
<section class="terminal" aria-live="polite"><div class="term-head"><span class="dot"></span> LIVE VERIFICATION LOG</div><div class="logs" id="logs"><div class="line">Initializing verification...</div><span class="cursor" id="cursor"></span></div><div class="progress"><div class="bar" id="bar"></div></div></section>
<section class="result" id="result"><div class="check">✓</div><div class="verified">Verified</div><div class="status">STATUS: VERIFIED</div></section>
<button class="continue" id="continue">Continue to Bot</button>
<p class="hint" id="hint">Keep this window open while verification is running.</p>
</main>
<script>
(()=>{
 const tg=window.Telegram&&window.Telegram.WebApp,params=new URLSearchParams(location.search),botId=params.get('bot_id')||'';
 const logs=document.getElementById('logs'),cursor=document.getElementById('cursor'),bar=document.getElementById('bar'),hint=document.getElementById('hint');
 if(tg){tg.ready();tg.expand();}
 function line(t){const d=document.createElement('div');d.className='line';d.textContent=t;logs.insertBefore(d,cursor);}
 function wait(ms){return new Promise(r=>setTimeout(r,ms));}
 function device(){let id=localStorage.getItem('botworld_device_id');if(!id){id=(crypto&&crypto.randomUUID)?crypto.randomUUID():'device-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);localStorage.setItem('botworld_device_id',id);}return id;}
 async function run(){
  if(!tg||!tg.initData){line('Open this page from the Verify button in Telegram.');hint.textContent='Telegram session is missing.';return;}
  if(!botId){line('Bot information is missing.');hint.textContent='Return to your bot and open verification again.';return;}
  let id;try{id=device();}catch(e){line('Device storage is unavailable.');hint.textContent='Allow site storage and try again.';return;}
  const steps=['Verifying your account...','Checking Telegram session...','Reading device information...','Preparing secure verification request...','Sending verification request to server...'];
  for(let i=0;i<steps.length;i++){line(steps[i]);bar.style.width=((i+1)/6*100)+'%';await wait(i===0?350:520);}
  line('Waiting for server confirmation...');bar.style.width='92%';
  try{tg.sendData(JSON.stringify({bot_id:botId,init_data:tg.initData,device_id:id}));}
  catch(e){line('Could not send request.');hint.textContent='Close this page and try again.';}
 }
 document.getElementById('continue').addEventListener('click',()=>{if(tg)tg.close();else history.back();});
 run();
})();
</script></body></html>
