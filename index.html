<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Botworld Account Verification</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--tg-theme-bg-color,#17212b);color:var(--tg-theme-text-color,#fff);font-family:system-ui,sans-serif}main{width:min(100%,420px);text-align:center}.mark{width:86px;height:86px;margin:0 auto 22px;border-radius:26px;display:grid;place-items:center;background:#2481cc;font-size:42px}h1{font-size:26px;margin:0 0 12px}p{color:var(--tg-theme-hint-color,#aab7c4);line-height:1.55;margin:0 0 24px}button{width:100%;border:0;border-radius:14px;padding:16px;background:var(--tg-theme-button-color,#2481cc);color:var(--tg-theme-button-text-color,#fff);font-size:17px;font-weight:700}button:disabled{opacity:.6}#result{margin-top:18px;min-height:24px;font-weight:600}
  </style>
</head>
<body>
<main>
  <div class="mark">✓</div>
  <h1>Verify Your Account</h1>
  <p>Confirm your Telegram account and continue to the bot.</p>
  <button id="verify">Verify</button>
  <div id="result" role="status" aria-live="polite"></div>
</main>
<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  const button = document.getElementById('verify');
  const result = document.getElementById('result');
  const params = new URLSearchParams(window.location.search);
  const botId = params.get('bot_id') || '';
  if (tg) { tg.ready(); tg.expand(); }
  button.addEventListener('click', () => {
    if (!tg || !tg.initData) {
      result.textContent = 'Please open this page using the Verify button inside the Telegram bot.';
      return;
    }
    if (!botId) {
      result.textContent = 'Bot information is missing. Please reopen Verify from your bot.';
      return;
    }
    let deviceId = '';
    try {
      deviceId = localStorage.getItem('botworld_device_id') || '';
      if (!deviceId) {
        deviceId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('bw-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2));
        localStorage.setItem('botworld_device_id', deviceId);
      }
    } catch (e) {
      result.textContent = 'This browser does not allow local device storage. Please enable site storage and try again.';
      return;
    }
    button.disabled = true;
    result.textContent = 'Sending verification to your bot…';
    try {
      tg.sendData(JSON.stringify({bot_id: botId, init_data: tg.initData, device_id: deviceId}));
    } catch (e) {
      button.disabled = false;
      result.textContent = 'Could not send verification. Please close this page and try again from your bot.';
    }
  });
})();
</script>
</body>
</html>
